packages:
  - layers/*
  - apps/*

# Vite+ ships its own vite build (vite-plus-core). Its release is pinned once, in
# the catalog: the root devDependency makes it the `vite` that every peer
# dependency on vite resolves to (otherwise pnpm installs the real vite next to
# it), the override covers the plain dependencies on vite, and test/flags.ts
# imports it. Keep it equal to devDependencies.vite-plus; Dependabot cannot move
# it, scripts/sync-vite-plus-pins.mjs does on its vite-plus PRs.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0

overrides:
  vite: 'catalog:'

# Dependency install scripts do not run unless listed. esbuild's only checks its
# platform binary (the one it ships as a platform package works without), but
# the old npm setup allowed it (allowScripts), so keep it. Nothing else builds.
allowBuilds:
  esbuild: true

# Packages the app imports but whose version belongs to a framework package:
# nuxt (vue, vue-router, h3, nitropack, ufo, ohash, ofetch, @nuxt/kit),
# @pinia/nuxt (pinia), @nuxtjs/i18n (vue-i18n, @intlify/utils). They are hoisted from that package's tree instead of declared here, so they move
# only when it moves: declared, Dependabot bumped them alone (h3 2 for Nitro 3, a
# vue-i18n ahead of the @intlify runtime @nuxtjs/i18n pins) and broke the build.
# (Tailwind is ours, not a framework package's: tailwindcss and @tailwindcss/vite
# are declared in package.json and move together, see .github/dependabot.yml.)
#
# vitest: @nuxt/test-utils finds out which vitest major runs by resolving
# `vitest` from the project root, and picks the module to import (vitest/runtime
# from 5 on) from it. Nothing depends on vitest directly (vite-plus bundles it).
publicHoistPattern:
  - vitest
  - vue
  - vue-router
  - h3
  - nitropack
  - ufo
  - ohash
  - ofetch
  - '@nuxt/kit'
  - pinia
  - vue-i18n
  - '@intlify/utils'
