name: CI

# Pull requests run this directly. Pushes to main and release tags run it through
# the "tests" job of action.yml (workflow_call), which every image build waits for.
on:
  pull_request:
    branches: [main]
  workflow_call:
  # Started by dependabot-vite-plus.yml after it pushed on a Dependabot branch.
  workflow_dispatch:

# A called workflow cannot hold more than its caller grants.
permissions:
  contents: read

jobs:
  check:
    name: Vite+ check and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: '24'
          cache: true

      - name: vp check (format, lint, type check) and repo guard scripts
        run: vp run check

      # Unit tests with v8 coverage; the thresholds (test.coverage.thresholds in vite.config.ts) fail the job
      # when coverage drops. Nothing is uploaded. See docs/testing.md.
      - name: Unit tests with coverage (vp test)
        run: vp test run --coverage

      # The release and nightly workflows refuse an untested commit through
      # this script: keep its verdicts honest.
      - name: Self-test the green-commit gate
        run: bash .github/scripts/main-green.test.sh

  typecheck:
    name: Typecheck (${{ matrix.app }})
    runs-on: ubuntu-latest
    # vue-tsc also checks Vue templates, which vp check does not.
    strategy:
      fail-fast: false
      matrix:
        app: [tokyosushi, ygfliege]
    env:
      BASE_URL: https://localhost
      API_BASE_URL: https://localhost/api/v1
      S3_BUCKET_URL: https://localhost
      GRAPHQL_WS_URL: wss://localhost/api/v1/graphql
      ZITADEL_AUTHORITY: https://localhost
      ZITADEL_CLIENT_ID: ci-dummy-client-id
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: '24'
          cache: true

      - name: Typecheck
        working-directory: apps/${{ matrix.app }}
        run: vp exec nuxi typecheck

  build:
    name: Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [tokyosushi, ygfliege]
    env:
      BASE_URL: https://localhost
      API_BASE_URL: https://localhost/api/v1
      S3_BUCKET_URL: https://localhost
      GRAPHQL_WS_URL: wss://localhost/api/v1/graphql
      ZITADEL_AUTHORITY: https://localhost
      ZITADEL_CLIENT_ID: ci-dummy-client-id
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: '24'
          cache: true

      - name: Build
        run: pnpm --filter ${{ matrix.app }} run build

  # Pull requests build the Docker image of one brand and boot it, as the release jobs of action.yml do, so a change to
  # the Dockerfile, its base image or the package manager install can never merge untested. Pushes to main and release
  # tags (workflow_call from action.yml) skip it: their images are built and smoke-tested right after, with the real
  # build arguments. One brand is enough: the Dockerfile is shared and ygfliege only differs by APP.
  image:
    name: Docker image boots (tokyosushi)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image (amd64, dummy build arguments)
        run: |
          docker buildx build . \
            --file Dockerfile \
            --build-arg APP=tokyosushi \
            --platform linux/amd64 \
            --tag pili-shop-ci:pr \
            --build-arg BASE_URL=https://localhost \
            --build-arg API_BASE_URL=https://localhost/api/v1 \
            --build-arg S3_BUCKET_URL=https://localhost \
            --build-arg GRAPHQL_WS_URL=wss://localhost/api/v1/graphql \
            --build-arg ZITADEL_AUTHORITY=https://localhost \
            --build-arg ZITADEL_CLIENT_ID=ci-dummy-client-id \
            --load

      - name: Boot smoke test
        run: scripts/ci-smoke-image.sh pili-shop-ci:pr

  e2e-mock:
    name: E2E (mock) (${{ matrix.app }}, ${{ matrix.shard }})
    # Production build of the app against the in-repo mock of tsb-service (layers/engine/e2e/mock): no secret, database
    # or Zitadel. Each shard builds the app itself (Playwright webServer) and runs one half of the suite, chromium only:
    # a brand's whole run is ~20 min on one worker (the mock holds one state, so no parallelism), a shard ~10 min.
    # Starts only once the ~1 min checks passed, so a lint, type or build failure never pays for four shards.
    needs: [check, typecheck, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [tokyosushi, ygfliege]
        shard: [desktop, mobile]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: '24'
          cache: true

      - name: Install Playwright browsers
        run: vp exec playwright install --with-deps chromium

      - name: Run E2E tests against the mock
        run: pnpm --filter ${{ matrix.app }} run test:e2e:mock:${{ matrix.shard }}

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.app }}-${{ matrix.shard }}
          path: |
            apps/${{ matrix.app }}/playwright-report
            apps/${{ matrix.app }}/test-results
          retention-days: 7

  test:
    name: E2E Tests
    needs: [check, typecheck, build]
    runs-on: ubuntu-latest
    # Real-backend run: pull requests only, so it never gates a deploy.
    if: ${{ vars.E2E_ENABLED == 'true' && github.event_name == 'pull_request' }}
    env:
      BASE_URL: https://localhost
      API_BASE_URL: https://localhost/api/v1
      S3_BUCKET_URL: https://localhost
      GRAPHQL_WS_URL: wss://localhost/api/v1/graphql
      ZITADEL_AUTHORITY: https://localhost
      ZITADEL_CLIENT_ID: ci-dummy-client-id
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: '24'
          cache: true

      - name: Install Playwright browsers
        run: vp exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm run test:e2e
