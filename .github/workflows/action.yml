name: Build and Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'ygf-v*' # ygfliege production releases (independent cadence)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rollback to (e.g. v1.0.0)'
        required: true
        type: string

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME_TSB: ${{ github.repository_owner }}/pili-shop-tsb
  IMAGE_NAME_YGF: ${{ github.repository_owner }}/pili-shop-ygf

# GITHUB_TOKEN stays read-only: GHCR pushes log in with secrets.PAT, deploys use
# SSH or the test webhook. smoke_production grants itself actions: write (it
# dispatches the rollback run).
permissions:
  contents: read

# ── tokyosushi test image (auto on push to main) ─────────────────────────────

jobs:
  # ── Tests (every push to main and every release tag) ───────────────────────
  # The whole of ci.yml runs first; every image build waits for it, so a commit
  # that fails its checks never produces an image, a test deploy or a release.
  # The rollback job does not need it: it ships an old, already-released version.
  tests:
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build_tokyosushi_amd64:
    needs: tests
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    name: Build tokyosushi AMD64 Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and Push tokyosushi AMD64 Image
        run: |
          docker buildx build . \
            --file Dockerfile \
            --build-arg APP=tokyosushi \
            --platform linux/amd64 \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_TSB }}:latest-amd64 \
            --build-arg BASE_URL=${{ vars.TSB_BASE_URL }} \
            --build-arg API_BASE_URL=${{ vars.TSB_API_BASE_URL }} \
            --build-arg S3_BUCKET_URL=${{ vars.TSB_S3_BUCKET_URL }} \
            --build-arg GRAPHQL_WS_URL=${{ vars.TSB_GRAPHQL_WS_URL }} \
            --build-arg ZITADEL_AUTHORITY=${{ vars.TSB_ZITADEL_AUTHORITY }} \
            --build-arg ZITADEL_CLIENT_ID=${{ vars.TSB_ZITADEL_CLIENT_ID }} \
            --build-arg UMAMI_HOST=${{ vars.TSB_UMAMI_HOST }} \
            --build-arg UMAMI_WEBSITE_ID=${{ vars.TSB_UMAMI_WEBSITE_ID }} \
            --build-arg NUXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TSB_TURNSTILE_SITE_KEY }} \
            --load

      # Boots the image that was just built (the server must answer and render a page)
      # before anything is pushed: a broken image never reaches the registry.
      - name: Boot smoke test
        run: scripts/ci-smoke-image.sh ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_TSB }}:latest-amd64

      - name: Push image
        run: |
          docker push ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_TSB }}:latest-amd64

  build_tokyosushi_arm64:
    needs: tests
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    name: Build tokyosushi ARM64 Image
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and Push tokyosushi ARM64 Image
        run: |
          docker buildx build . \
            --file Dockerfile \
            --build-arg APP=tokyosushi \
            --platform linux/arm64 \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_TSB }}:latest-arm64 \
            --build-arg BASE_URL=${{ vars.TSB_BASE_URL }} \
            --build-arg API_BASE_URL=${{ vars.TSB_API_BASE_URL }} \
            --build-arg S3_BUCKET_URL=${{ vars.TSB_S3_BUCKET_URL }} \
            --build-arg GRAPHQL_WS_URL=${{ vars.TSB_GRAPHQL_WS_URL }} \
            --build-arg ZITADEL_AUTHORITY=${{ vars.TSB_ZITADEL_AUTHORITY }} \
            --build-arg ZITADEL_CLIENT_ID=${{ vars.TSB_ZITADEL_CLIENT_ID }} \
            --build-arg UMAMI_HOST=${{ vars.TSB_UMAMI_HOST }} \
            --build-arg UMAMI_WEBSITE_ID=${{ vars.TSB_UMAMI_WEBSITE_ID }} \
            --build-arg NUXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TSB_TURNSTILE_SITE_KEY }} \
            --load

      # Boots the image that was just built (the server must answer and render a page)
      # before anything is pushed: a broken image never reaches the registry.
      - name: Boot smoke test
        run: scripts/ci-smoke-image.sh ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_TSB }}:latest-arm64

      - name: Push image
        run: |
          docker push ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_TSB }}:latest-arm64

  create_manifest_tokyosushi:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    name: Create tokyosushi Multi-Architecture Manifest
    runs-on: ubuntu-latest
    needs: [build_tokyosushi_amd64, build_tokyosushi_arm64]

    steps:
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Create and Push Manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_TSB }}:latest \
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_TSB }}:latest-amd64 \
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_TSB }}:latest-arm64

  deploy_test_tokyosushi:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    needs: create_manifest_tokyosushi
    name: Deploy tokyosushi to Home Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the smoke test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/smoke.sh
          sparse-checkout-cone-mode: false

      - name: Trigger deploy webhook
        run: |
          curl -X POST ${{ vars.TSB_DEPLOY_WEBHOOK_URL }} \
            -H "X-Deploy-Token: ${{ secrets.TSB_DEPLOY_TOKEN }}" \
            --fail --max-time 300

      # The webhook answering does not mean the new container came up: poll the test server for 4 minutes.
      # Repository variable TSB_TEST_BASE_URL = public URL of the tokyosushi shop test server.
      - name: Wait for the test server to answer
        env:
          URL: ${{ vars.TSB_TEST_BASE_URL }}
          SMOKE_ATTEMPTS: '24'
          SMOKE_DELAY: '10'
        run: |
          if [ -z "$URL" ]; then
            echo "::warning::Repository variable TSB_TEST_BASE_URL is not set: the test deploy is not verified."
            exit 0
          fi
          scripts/smoke.sh shop "$URL"

  # ── ygfliege (second brand) ──────────────────────────────────────────────────
  # Dormant until the YGF_* repo/environment vars are created (no-op otherwise).
  # Test image on push to main; production image on `ygf-v*` tags.
  # The test image is multi-arch: the home server (asahi) is arm64, so an
  # amd64-only image would not start there.

  build_ygfliege_amd64:
    needs: tests
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && vars.YGF_BASE_URL != ''
    name: Build ygfliege AMD64 Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and Push ygfliege AMD64 Image
        run: |
          docker buildx build . \
            --file Dockerfile \
            --build-arg APP=ygfliege \
            --platform linux/amd64 \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_YGF }}:latest-amd64 \
            --build-arg BASE_URL=${{ vars.YGF_BASE_URL }} \
            --build-arg API_BASE_URL=${{ vars.YGF_API_BASE_URL }} \
            --build-arg S3_BUCKET_URL=${{ vars.YGF_S3_BUCKET_URL }} \
            --build-arg GRAPHQL_WS_URL=${{ vars.YGF_GRAPHQL_WS_URL }} \
            --build-arg ZITADEL_AUTHORITY=${{ vars.YGF_ZITADEL_AUTHORITY }} \
            --build-arg ZITADEL_CLIENT_ID=${{ vars.YGF_ZITADEL_CLIENT_ID }} \
            --build-arg UMAMI_HOST=${{ vars.YGF_UMAMI_HOST }} \
            --build-arg UMAMI_WEBSITE_ID=${{ vars.YGF_UMAMI_WEBSITE_ID }} \
            --build-arg NUXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.YGF_TURNSTILE_SITE_KEY }} \
            --load

      # Boots the image that was just built (the server must answer and render a page)
      # before anything is pushed: a broken image never reaches the registry.
      - name: Boot smoke test
        run: scripts/ci-smoke-image.sh ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_YGF }}:latest-amd64

      - name: Push image
        run: |
          docker push ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_YGF }}:latest-amd64

  build_ygfliege_arm64:
    needs: tests
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && vars.YGF_BASE_URL != ''
    name: Build ygfliege ARM64 Image
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and Push ygfliege ARM64 Image
        run: |
          docker buildx build . \
            --file Dockerfile \
            --build-arg APP=ygfliege \
            --platform linux/arm64 \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_YGF }}:latest-arm64 \
            --build-arg BASE_URL=${{ vars.YGF_BASE_URL }} \
            --build-arg API_BASE_URL=${{ vars.YGF_API_BASE_URL }} \
            --build-arg S3_BUCKET_URL=${{ vars.YGF_S3_BUCKET_URL }} \
            --build-arg GRAPHQL_WS_URL=${{ vars.YGF_GRAPHQL_WS_URL }} \
            --build-arg ZITADEL_AUTHORITY=${{ vars.YGF_ZITADEL_AUTHORITY }} \
            --build-arg ZITADEL_CLIENT_ID=${{ vars.YGF_ZITADEL_CLIENT_ID }} \
            --build-arg UMAMI_HOST=${{ vars.YGF_UMAMI_HOST }} \
            --build-arg UMAMI_WEBSITE_ID=${{ vars.YGF_UMAMI_WEBSITE_ID }} \
            --build-arg NUXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.YGF_TURNSTILE_SITE_KEY }} \
            --load

      # Boots the image that was just built (the server must answer and render a page)
      # before anything is pushed: a broken image never reaches the registry.
      - name: Boot smoke test
        run: scripts/ci-smoke-image.sh ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_YGF }}:latest-arm64

      - name: Push image
        run: |
          docker push ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_YGF }}:latest-arm64

  create_manifest_ygfliege:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && vars.YGF_BASE_URL != ''
    name: Create ygfliege Multi-Architecture Manifest
    runs-on: ubuntu-latest
    needs: [build_ygfliege_amd64, build_ygfliege_arm64]

    steps:
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Create and Push Manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_YGF }}:latest \
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_YGF }}:latest-amd64 \
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_YGF }}:latest-arm64

  deploy_test_ygfliege:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && vars.YGF_BASE_URL != ''
    needs: create_manifest_ygfliege
    name: Deploy ygfliege to Home Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the smoke test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/smoke.sh
          sparse-checkout-cone-mode: false

      - name: Trigger deploy webhook
        run: |
          curl -X POST ${{ vars.YGF_DEPLOY_WEBHOOK_URL }} \
            -H "X-Deploy-Token: ${{ secrets.YGF_DEPLOY_TOKEN }}" \
            --fail --max-time 300

      # The webhook answering does not mean the new container came up: poll the test server for 4 minutes.
      # Repository variable YGF_TEST_BASE_URL = public URL of the ygfliege shop test server.
      - name: Wait for the test server to answer
        env:
          URL: ${{ vars.YGF_TEST_BASE_URL }}
          SMOKE_ATTEMPTS: '24'
          SMOKE_DELAY: '10'
        run: |
          if [ -z "$URL" ]; then
            echo "::warning::Repository variable YGF_TEST_BASE_URL is not set: the test deploy is not verified."
            exit 0
          fi
          scripts/smoke.sh shop "$URL"

  build_production_ygfliege:
    needs: tests
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ygf-v')
    name: Build ygfliege Production Image
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and Push ygfliege Production Image
        run: |
          docker buildx build . \
            --file Dockerfile \
            --build-arg APP=ygfliege \
            --platform linux/amd64 \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_YGF }}:production \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_YGF }}:${{ github.ref_name }} \
            --build-arg BASE_URL=${{ vars.YGF_BASE_URL }} \
            --build-arg API_BASE_URL=${{ vars.YGF_API_BASE_URL }} \
            --build-arg S3_BUCKET_URL=${{ vars.YGF_S3_BUCKET_URL }} \
            --build-arg GRAPHQL_WS_URL=${{ vars.YGF_GRAPHQL_WS_URL }} \
            --build-arg ZITADEL_AUTHORITY=${{ vars.YGF_ZITADEL_AUTHORITY }} \
            --build-arg ZITADEL_CLIENT_ID=${{ vars.YGF_ZITADEL_CLIENT_ID }} \
            --build-arg UMAMI_HOST=${{ vars.YGF_UMAMI_HOST }} \
            --build-arg UMAMI_WEBSITE_ID=${{ vars.YGF_UMAMI_WEBSITE_ID }} \
            --build-arg NUXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.YGF_TURNSTILE_SITE_KEY }} \
            --build-arg SENTRY_DSN=${{ vars.YGF_SENTRY_DSN }} \
            --build-arg SENTRY_ENVIRONMENT=production \
            --build-arg SENTRY_RELEASE=${{ github.ref_name }} \
            --build-arg SENTRY_ORG=${{ vars.YGF_SENTRY_ORG }} \
            --build-arg SENTRY_PROJECT=${{ vars.YGF_SENTRY_PROJECT }} \
            --build-arg SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }} \
            --load

      # Boots the image that was just built (the server must answer and render a page)
      # before anything is pushed: a broken image never reaches the registry.
      - name: Boot smoke test
        run: scripts/ci-smoke-image.sh ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_YGF }}:production

      - name: Push image
        run: |
          docker push ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_YGF }}:production
          docker push ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_YGF }}:${{ github.ref_name }}

  deploy_production_ygfliege:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ygf-v')
    needs: build_production_ygfliege
    name: Deploy ygfliege to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout the smoke test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/smoke.sh
          sparse-checkout-cone-mode: false

      - name: Deploy via SSH (Helm)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          APP: tsb-core
          TAG: ${{ github.ref_name }}
          REPO: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_YGF }}
        with:
          host: ${{ vars.OVH_HOST }}
          username: ${{ vars.OVH_USER }}
          key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          envs: APP,TAG,REPO
          script: |
            set -euo pipefail
            export SOPS_AGE_KEY_FILE=/opt/tokyosushi/.config/sops/age/keys.txt
            cd /opt/tokyosushi/tsb-infra
            git pull --ff-only
            sops -d "secrets/ygf-${APP}.secret.enc.yaml" | sudo kubectl apply -n ygf -f -
            sudo flock -w 600 /var/lock/ygf-apps-helm.lock env KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm upgrade --install ygf-apps ./charts/tokyosushi-apps \
              --namespace ygf \
              -f ./charts/tokyosushi-apps/values.ygf.yaml \
              --reuse-values \
              --set "apps.${APP}.enabled=true" \
              --set "apps.${APP}.image.repository=${REPO}" \
              --set "apps.${APP}.image.tag=${TAG}" \
              --atomic --timeout 5m

      - name: Smoke test ygfliege
        id: smoke_ygf
        env:
          URL: ${{ vars.YGF_BASE_URL }}
        run: scripts/smoke.sh --skip-unset shop "$URL"

      - name: Roll back ygfliege after a failed smoke test
        id: rollback_ygf
        if: failure() && steps.smoke_ygf.outcome == 'failure'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ vars.OVH_HOST }}
          username: ${{ vars.OVH_USER }}
          key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            sudo flock -w 600 /var/lock/ygf-apps-helm.lock env KUBECONFIG=/etc/rancher/k3s/k3s.yaml \
              helm rollback ygf-apps --namespace ygf --wait --timeout 5m

      - name: Alert on a failed deploy
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT: >-
            pili-shop ${{ github.ref_name }}: ygfliege production deploy failed.
            smoke ${{ steps.smoke_ygf.outcome }}, rollback ${{ steps.rollback_ygf.outcome }}.
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then exit 0; fi
          curl -fsS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" \
            || echo "::warning::Telegram alert failed"

  # ── tokyosushi production release (tag push v*) ─────────────────────────────

  build_production_tokyosushi:
    needs: tests
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Build tokyosushi Production Image
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and Push tokyosushi Production Image
        run: |
          docker buildx build . \
            --file Dockerfile \
            --build-arg APP=tokyosushi \
            --platform linux/amd64 \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_TSB }}:production \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_TSB }}:${{ github.ref_name }} \
            --build-arg BASE_URL=${{ vars.TSB_BASE_URL }} \
            --build-arg API_BASE_URL=${{ vars.TSB_API_BASE_URL }} \
            --build-arg S3_BUCKET_URL=${{ vars.TSB_S3_BUCKET_URL }} \
            --build-arg GRAPHQL_WS_URL=${{ vars.TSB_GRAPHQL_WS_URL }} \
            --build-arg ZITADEL_AUTHORITY=${{ vars.TSB_ZITADEL_AUTHORITY }} \
            --build-arg ZITADEL_CLIENT_ID=${{ vars.TSB_ZITADEL_CLIENT_ID }} \
            --build-arg UMAMI_HOST=${{ vars.TSB_UMAMI_HOST }} \
            --build-arg UMAMI_WEBSITE_ID=${{ vars.TSB_UMAMI_WEBSITE_ID }} \
            --build-arg NUXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TSB_TURNSTILE_SITE_KEY }} \
            --build-arg SENTRY_DSN=${{ vars.TSB_SENTRY_DSN }} \
            --build-arg SENTRY_ENVIRONMENT=production \
            --build-arg SENTRY_RELEASE=${{ github.ref_name }} \
            --build-arg SENTRY_ORG=${{ vars.TSB_SENTRY_ORG }} \
            --build-arg SENTRY_PROJECT=${{ vars.TSB_SENTRY_PROJECT }} \
            --build-arg SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }} \
            --load

      # Boots the image that was just built (the server must answer and render a page)
      # before anything is pushed: a broken image never reaches the registry.
      - name: Boot smoke test
        run: scripts/ci-smoke-image.sh ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_TSB }}:production

      - name: Push image
        run: |
          docker push ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_TSB }}:production
          docker push ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_TSB }}:${{ github.ref_name }}

  deploy_production_tokyosushi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build_production_tokyosushi
    name: Deploy tokyosushi to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout the smoke test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/smoke.sh
          sparse-checkout-cone-mode: false

      - name: Deploy via SSH (Helm)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          APP: tsb-core
          TAG: ${{ github.ref_name }}
          REPO: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_TSB }}
        with:
          host: ${{ vars.OVH_HOST }}
          username: ${{ vars.OVH_USER }}
          key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          envs: APP,TAG,REPO
          script: |
            set -euo pipefail
            export SOPS_AGE_KEY_FILE=/opt/tokyosushi/.config/sops/age/keys.txt
            cd /opt/tokyosushi/tsb-infra
            git pull --ff-only
            sops -d "secrets/${APP}.secret.enc.yaml" | sudo kubectl apply -n tokyosushi -f -
            sudo flock -w 600 /var/lock/tokyosushi-apps-helm.lock env KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm upgrade --install tokyosushi-apps ./charts/tokyosushi-apps \
              --namespace tokyosushi \
              --reuse-values \
              --set "apps.${APP}.image.repository=${REPO}" \
              --set "apps.${APP}.image.tag=${TAG}" \
              --atomic --timeout 5m

      - name: Smoke test tokyosushi
        id: smoke_tokyosushi
        env:
          URL: ${{ vars.TSB_BASE_URL }}
        run: scripts/smoke.sh --skip-unset shop "$URL"

      - name: Roll back tokyosushi after a failed smoke test
        id: rollback_tokyosushi
        if: failure() && steps.smoke_tokyosushi.outcome == 'failure'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ vars.OVH_HOST }}
          username: ${{ vars.OVH_USER }}
          key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            sudo flock -w 600 /var/lock/tokyosushi-apps-helm.lock env KUBECONFIG=/etc/rancher/k3s/k3s.yaml \
              helm rollback tokyosushi-apps --namespace tokyosushi --wait --timeout 5m

      - name: Alert on a failed deploy
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT: >-
            pili-shop ${{ github.ref_name }}: tokyosushi production deploy failed.
            smoke ${{ steps.smoke_tokyosushi.outcome }}, rollback ${{ steps.rollback_tokyosushi.outcome }}.
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then exit 0; fi
          curl -fsS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" \
            || echo "::warning::Telegram alert failed"

  # ── tokyosushi rollback (manual trigger) ─────────────────────────────────────

  rollback_tokyosushi:
    if: github.event_name == 'workflow_dispatch'
    name: Rollback tokyosushi Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Rollback via SSH (Helm)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          APP: tsb-core
          TAG: ${{ inputs.version }}
          REPO: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_TSB }}
        with:
          host: ${{ vars.OVH_HOST }}
          username: ${{ vars.OVH_USER }}
          key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          envs: APP,TAG,REPO
          script: |
            set -euo pipefail
            cd /opt/tokyosushi/tsb-infra
            sudo flock -w 600 /var/lock/tokyosushi-apps-helm.lock env KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm upgrade --install tokyosushi-apps ./charts/tokyosushi-apps \
              --namespace tokyosushi \
              --reuse-values \
              --set "apps.${APP}.image.repository=${REPO}" \
              --set "apps.${APP}.image.tag=${TAG}" \
              --atomic --timeout 5m

  # ── Production smoke test (tag push v*) ─────────────────────────────────────

  smoke_production:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: deploy_production_tokyosushi
    name: Smoke test production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      SITE: ${{ vars.TSB_BASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Passes when the shop renders its French home page on the server, retried for 5 minutes.
      - name: Check the live site
        id: smoke
        run: |
          set -uo pipefail
          if [ -z "${SITE:-}" ]; then echo "::error::Production URL variable missing."; exit 1; fi
          live() {
            # The query string skips any cached copy of the page.
            curl -fsS --max-time 30 "$SITE/fr?smoke=$GITHUB_RUN_ID" | grep -q '__NUXT_DATA__'
          }
          for i in $(seq 1 10); do
            if live; then echo "Smoke test passed (attempt $i)."; exit 0; fi
            echo "Attempt $i failed, retrying in 30 s."
            sleep 30
          done
          exit 1

      # A release tagged by "Nightly dependency release" only carries
      # Dependabot updates (no migration), so the previous version is a safe
      # target. A release tagged by hand is never rolled back automatically.
      - name: Roll back an automated release
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          set -euo pipefail
          repo="${GH_REPO#*/}"
          notify() {
            if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then return 0; fi
            curl -fsS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$1" \
              --data-urlencode "disable_web_page_preview=true" \
              --data-urlencode "disable_notification=true" \
              || echo "::warning::Telegram alert failed: $1"
          }
          subject=$(git tag -l --format='%(contents:subject)' "$TAG")
          prev=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | awk -v t="$TAG" 'found { print; exit } $0 == t { found = 1 }')
          if [[ "$subject" == "Automated dependency release"* ]] && [ -n "$prev" ]; then
            gh workflow run action.yml --ref main -f version="$prev"
            notify "↩️ $repo $TAG failed its production smoke test: rolling back to $prev. $GITHUB_SERVER_URL/$GH_REPO/actions"
          else
            notify "🔥 $repo $TAG failed its production smoke test. Not an automated release: check it, and roll back by hand (Run workflow, version $prev) if needed. $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
          fi
